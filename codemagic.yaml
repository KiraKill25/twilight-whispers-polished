workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Build web assets via Vite / Nitro
          npx vite build

          # Verify output directory exists
          if [ ! -d ".output/public" ]; then
            echo "Error: .output/public directory missing."
            exit 1
          fi

          # Generate required index.html entry point for Capacitor if missing
          if [ ! -f ".output/public/index.html" ]; then
            echo "Creating entry index.html in .output/public..."
            JS_FILE=$(basename $(ls .output/public/assets/index-*.js 2>/dev/null | head -n 1))
            CSS_FILE=$(basename $(ls .output/public/assets/styles-*.css 2>/dev/null | head -n 1))

            cat <<EOF > .output/public/index.html
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Mourad's Ville</title>
              <link rel="stylesheet" href="./assets/${CSS_FILE}">
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/${JS_FILE}"></script>
            </body>
            </html>
            EOF
          fi

          # Configure Capacitor configuration
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.mouradsville.game",
            "appName": "Mourad's Ville",
            "webDir": ".output/public",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # Add Android platform and copy assets
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
