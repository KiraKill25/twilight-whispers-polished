workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Clean build cache & dependencies
        script: |
          rm -rf node_modules package-lock.json .vite dist .output android/app/build android/.gradle
          npm cache clean --force

      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & ImageMagick
        script: |
          brew install imagemagick
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate Android App Icons Directly
        script: |
          # Define Android mipmap sizes
          declare -A sizes=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )

          # Generate PNG icons directly into native Android folders
          for folder in "${!sizes[@]}"; do
            size=${sizes[$folder]}
            target_dir="android/app/src/main/res/$folder"
            mkdir -p "$target_dir"
            magick assets/icon.png -resize ${size}x${size} "$target_dir/ic_launcher.png"
            magick assets/icon.png -resize ${size}x${size} "$target_dir/ic_launcher_round.png"
            magick assets/icon.png -resize ${size}x${size} "$target_dir/ic_launcher_foreground.png"
          done

      - name: Build Web Assets & Configure Capacitor
        script: |
          npx vite build

          # Fix relative asset paths for Android WebView
          node -e '
            const fs = require("fs"), path = require("path");
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            fixPaths("dist");
          '

          # Disable native splash screen to avoid white screen before webview loads
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"dist\",\"server\":{\"androidScheme\":\"https\"},\"plugins\":{\"SplashScreen\":{\"launchShowDuration\":0}}}" > capacitor.config.json

          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          cat << 'EOF' >> app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
