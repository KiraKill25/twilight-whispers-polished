workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          npx vite build

          BUILD_DIR=".output/public"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR="dist"
          fi

          # Find entry point bundle generated by Vite
          JS_FILE=$(ls $BUILD_DIR/assets/index-*.js 2>/dev/null | head -n 1 | xargs -n 1 basename)

          # Inject index.html required by Capacitor
          cat << 'EOF' > $BUILD_DIR/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Mourads Ville</title>
          </head>
          <body>
            <div id="root"></div>
          EOF

          echo "  <script type=\"module\" src=\"./assets/$JS_FILE\"></script>" >> $BUILD_DIR/index.html
          echo "</body></html>" >> $BUILD_DIR/index.html

          # Fix relative path resolution for Capacitor WebView assets
          find $BUILD_DIR/assets -name "*.js" -exec sed -i '' 's|/assets/|./assets/|g' {} + 2>/dev/null || \
          find $BUILD_DIR/assets -name "*.js" -exec sed -i 's|/assets/|./assets/|g' {} + 2>/dev/null || true

          # Generate Capacitor Config
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"$BUILD_DIR\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Copy assets & sync native Android project
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
