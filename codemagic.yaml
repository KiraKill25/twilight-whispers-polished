workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Clean previous build artifacts
          rm -rf dist .output

          # Execute Vite build
          npx vite build

          # Automatically locate the compiled web assets directory
          if [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f ".output/public/index.html" ]; then
            WEB_DIR=".output/public"
          else
            echo "BUILD ERROR: index.html not found! Printing workspace structure:"
            ls -la
            ls -la .output 2>/dev/null || true
            exit 1
          fi

          echo "Target web directory found at: $WEB_DIR"

          # Fix asset pathing for WebView loading
          find $WEB_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i '' 's|href="/|href="./|g' {} + 2>/dev/null || \
          find $WEB_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|href="/|href="./|g' {} + 2>/dev/null || true

          find $WEB_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i '' 's|src="/|src="./|g' {} + 2>/dev/null || \
          find $WEB_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|src="/|src="./|g' {} + 2>/dev/null || true

          # Create Capacitor Config pointing to verified directory
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"$WEB_DIR\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Sync with Android Project
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
