      - name: Build Web Assets & Configure Capacitor
        script: |
          # Build web assets via Vite / Nitro
          npx vite build

          # Verify output directory exists
          if [ ! -d ".output/public" ]; then
            echo "Error: .output/public directory missing."
            exit 1
          fi

          # Rewrite absolute /assets/ imports inside compiled JS files to relative ./assets/
          find .output/public/assets -name "*.js" -exec sed -i '' 's|/assets/|./assets/|g' {} + 2>/dev/null || \
          find .output/public/assets -name "*.js" -exec sed -i 's|/assets/|./assets/|g' {} +

          # Find compiled entry assets
          JS_FILE=$(ls .output/public/assets/index-*.js 2>/dev/null | head -n 1 | xargs -n 1 basename)
          CSS_FILE=$(ls .output/public/assets/styles-*.css 2>/dev/null | head -n 1 | xargs -n 1 basename)

          # Write index.html with Eruda mobile devtools injected
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Mourads Ville</title><script src="https://cdn.jsdelivr.net/npm/eruda"></script><script>eruda.init();</script><link rel="stylesheet" href="./assets/'$CSS_FILE'"></head><body><div id="root"></div><div id="app"></div><script type="module" src="./assets/'$JS_FILE'"></script></body></html>' > .output/public/index.html

          # Write Capacitor configuration
          echo '{"appId":"com.mouradsville.game","appName":"Mourads Ville","webDir":".output/public","server":{"androidScheme":"https"}}' > capacitor.config.json

          # Add Android platform and sync assets
          npx cap add android || true
          npx cap copy android
          npx cap sync android
