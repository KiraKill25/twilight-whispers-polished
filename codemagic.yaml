workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Remove UTF-8 BOM characters recursively using Node.js
          node -e '
            const fs = require("fs"), path = require("path");
            function cleanBOM(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  cleanBOM(fullPath);
                } else if (fullPath.endsWith(".ts") || fullPath.endsWith(".tsx") || fullPath.endsWith(".js")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  if (content.charCodeAt(0) === 0xFEFF) {
                    fs.writeFileSync(fullPath, content.slice(1), "utf8");
                    console.log("Stripped BOM from:", fullPath);
                  }
                }
              }
            }
            cleanBOM("./src");
          '

          # Clean previous build artifacts
          rm -rf dist .output

          # Execute Vite build
          npx vite build

          # Locate generated web directory
          if [ -f "dist/index.html" ]; then
            WEB_DIR="dist"
          elif [ -f ".output/public/index.html" ]; then
            WEB_DIR=".output/public"
          else
            echo "BUILD ERROR: index.html not found! Directory contents:"
            ls -la .output 2>/dev/null || true
            exit 1
          fi

          # Fix relative asset pathing for WebView
          node -e '
            const fs = require("fs"), path = require("path");
            const webDir = process.env.WEB_DIR || "dist";
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            if (fs.existsSync(webDir)) fixPaths(webDir);
          '

          # Create Capacitor Config
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"$WEB_DIR\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Sync with Android
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
