workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          npx vite build

          if [ ! -d ".output/public" ]; then
            echo "Error: .output/public directory missing."
            exit 1
          fi

          # Fix relative module imports inside JS chunks
          find .output/public/assets -name "*.js" -exec sed -i '' 's|/assets/|./assets/|g' {} + 2>/dev/null || \
          find .output/public/assets -name "*.js" -exec sed -i 's|/assets/|./assets/|g' {} +

          JS_FILE=$(ls .output/public/assets/index-*.js 2>/dev/null | head -n 1 | xargs -n 1 basename)
          CSS_FILE=$(ls .output/public/assets/styles-*.css 2>/dev/null | head -n 1 | xargs -n 1 basename)

          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Mourads Ville</title><link rel="stylesheet" href="./assets/'$CSS_FILE'"></head><body><div id="root"></div><script type="module" src="./assets/'$JS_FILE'"></script></body></html>' > .output/public/index.html

          # Configure Capacitor
          echo '{"appId":"com.mouradsville.game","appName":"Mourads Ville","webDir":".output/public","server":{"androidScheme":"https"}}' > capacitor.config.json

          # Initialize Android project
          npx cap add android || true
          npx cap copy android
          npx cap sync android

          # FORCE COPY compiled assets directly into Android native folder
          mkdir -p android/app/src/main/assets/public
          cp -r .output/public/* android/app/src/main/assets/public/

      - name: Build Android Debug APK
        script: |
          cd android

          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
