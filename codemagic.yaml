workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        script: |
          npm run build

      - name: Configure Capacitor & Sync
        script: |
          # Detect whether Vite outputted to dist or build
          WEB_DIR="dist"
          if [ -d "build" ]; then
            WEB_DIR="build"
          fi

          echo "Using web directory: $WEB_DIR"

          # Write capacitor configuration
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.mouradsville.game",
            "appName": "Mourad's Ville",
            "webDir": "$WEB_DIR",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # Add Android platform and copy assets
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
