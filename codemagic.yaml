workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install Dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: Build Web Code & Add Android Native Platform
        script: |
          # 1. Compile web bundle (Vite)
          npx vite build

          # 2. Convert root paths to relative for Android WebView
          node -e '
            const fs = require("fs"), path = require("path");
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            fixPaths("dist");
          '

          # 3. Create Capacitor Configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mouradsville.game",
            "appName": "Mourads Ville",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

          # 4. GENERATE THE MISSING ANDROID FOLDER & LINK CAPACITOR
          npx cap add android
          npx cap sync android

          # 5. Apply dark native theme
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#000000</item>
                  <item name="colorPrimaryDark">#000000</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#000000</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

      - name: Generate App Icons
        script: |
          ICON_PATH=""
          if [ -f "assets/icon.png" ]; then
            ICON_PATH="assets/icon.png"
          elif [ -f "public/icon.png" ]; then
            ICON_PATH="public/icon.png"
          fi

          if [ -z "$ICON_PATH" ]; then
            echo "Error: icon.png not found in assets/ or public/!"
            exit 1
          fi

          rm -rf android/app/src/main/res/mipmap-*

          for item in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            folder="${item%%:*}"
            size="${item##*:}"
            target_dir="android/app/src/main/res/$folder"
            mkdir -p "$target_dir"
            
            sips -z "$size" "$size" "$ICON_PATH" --out "$target_dir/ic_launcher.png" > /dev/null
            sips -z "$size" "$size" "$ICON_PATH" --out "$target_dir/ic_launcher_round.png" > /dev/null
            sips -z "$size" "$size" "$ICON_PATH" --out "$target_dir/ic_launcher_foreground.png" > /dev/null
          done

      - name: Build Android Debug APK
        script: |
          cd android

          cat << 'EOF' >> app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
