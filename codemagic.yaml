workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Force Vite build to generate web assets into dist
          npx vite build

          # Verify dist directory creation
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory missing."
            ls -la
            exit 1
          fi

          # Write Capacitor configuration
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.mouradsville.game",
            "appName": "Mourad's Ville",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # Add Android platform and sync assets
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
