workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          npx vite build

          BUILD_DIR=".output/public"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR="dist"
          fi

          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "Generating index.html entry point..."
            ENTRY_JS=$(grep -l -E "createRoot|render|ClientRouter" $BUILD_DIR/assets/*.js 2>/dev/null | head -n 1 | xargs -n 1 basename)
            
            if [ -z "$ENTRY_JS" ]; then
              ENTRY_JS=$(ls $BUILD_DIR/assets/*.js | head -n 1 | xargs -n 1 basename)
            fi

            cat << EOF > $BUILD_DIR/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mourads Ville</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/$ENTRY_JS"></script>
</body>
</html>
EOF
          fi

          # Fix absolute path resolution for Capacitor WebView
          find $BUILD_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i '' 's|/assets/|./assets/|g' {} + 2>/dev/null || \
          find $BUILD_DIR -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|/assets/|./assets/|g' {} + 2>/dev/null || true

          # Generate Capacitor Config
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"$BUILD_DIR\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Copy assets & sync native Android project
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    resolutionStrategy {" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
