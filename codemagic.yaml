workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Clean previous build artifacts
          rm -rf dist .output

          # Execute Vite build
          npx vite build

          # Ensure relative asset paths for Android WebView
          node -e '
            const fs = require("fs"), path = require("path");
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            fixPaths("dist");
          '

          # Create Capacitor Config pointing to dist
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"dist\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Sync with Android
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
