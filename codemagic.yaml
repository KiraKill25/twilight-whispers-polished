workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install Node Dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen

      - name: Compile Web App
        script: |
          npx vite build
          node -e '
            const fs = require("fs"), path = require("path");
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            fixPaths("dist");
          '

      - name: Generate Native Android Shell & Build APK
        script: |
          # 1. Create capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.mouradsville.game",
            "appName": "Mourads Ville",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#000000",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

          # 2. Re-create android platform from scratch
          rm -rf android
          npx cap add android
          npx cap sync android

          # 3. Create missing capacitor.settings.gradle if Capacitor skipped it
          if [ ! -f "android/capacitor.settings.gradle" ]; then
            echo "// Auto-generated settings" > android/capacitor.settings.gradle
          fi

          # 4. Set native theme black background
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#000000</item>
                  <item name="colorPrimaryDark">#000000</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#000000</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          # 5. Fix Kotlin stdlib conflicts inside app build.gradle
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # 6. Execute Gradle build
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
