workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Clean build cache & dependencies
        script: |
          rm -rf node_modules package-lock.json .vite dist .output android/app/build android/.gradle
          npm cache clean --force

      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Assets Tool
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Generate Android App Icon
        script: |
          # Create assets directory if it doesn't exist
          mkdir -p assets

          # Copy icon from public/ into assets/ for Capacitor CLI
          if [ -f "public/icon.png" ]; then
            cp public/icon.png assets/icon.png
          fi

          # Generate native Android launcher icons
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android
          fi

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Execute Vite build
          npx vite build

          # Fix relative asset paths for Android WebView
          node -e '
            const fs = require("fs"), path = require("path");
            function fixPaths(dir) {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  fixPaths(fullPath);
                } else if (fullPath.endsWith(".html") || fullPath.endsWith(".js") || fullPath.endsWith(".css")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  content = content.replace(/href="\//g, "href=\"./").replace(/src="\//g, "src=\"./");
                  fs.writeFileSync(fullPath, content, "utf8");
                }
              }
            }
            fixPaths("dist");
          '

          # Create Capacitor Config pointing to dist
          echo "{\"appId\":\"com.mouradsville.game\",\"appName\":\"Mourads Ville\",\"webDir\":\"dist\",\"server\":{\"androidScheme\":\"https\"}}" > capacitor.config.json

          # Sync with Android
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android

          # Exclude legacy Kotlin JDK modules to fix duplicate class errors
          cat << 'EOF' >> app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
