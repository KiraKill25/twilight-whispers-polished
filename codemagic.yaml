workflows:
  android-offline-apk:
    name: Build Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor CLI & Core
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets & Configure Capacitor
        script: |
          # Build web assets via Vite / Nitro
          npx vite build

          # Verify output directory exists
          if [ ! -d ".output/public" ]; then
            echo "Error: .output/public directory missing."
            exit 1
          fi

          # Find compiled entry assets
          JS_FILE=$(ls .output/public/assets/index-*.js 2>/dev/null | head -n 1 | xargs -n 1 basename)
          CSS_FILE=$(ls .output/public/assets/styles-*.css 2>/dev/null | head -n 1 | xargs -n 1 basename)

          # Write single-line index.html entry point
          echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Mourads Ville</title><link rel="stylesheet" href="./assets/'$CSS_FILE'"></head><body><div id="root"></div><script type="module" src="./assets/'$JS_FILE'"></script></body></html>' > .output/public/index.html

          # Write Capacitor configuration
          echo '{"appId":"com.mouradsville.game","appName":"Mourads Ville","webDir":".output/public","server":{"androidScheme":"https"}}' > capacitor.config.json

          # Add Android platform and sync assets
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
